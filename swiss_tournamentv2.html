<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2º Torneio AEC Esposende</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e2a819;
    --gold-dim: #b88210;
    --gold-faint: rgba(226,168,25,0.07);
    --navy: #1b3c6f;
    --bg: #0e1117;
    --surface: #161b25;
    --surface2: #1c2333;
    --surface3: #232c3d;
    --border: #2a3348;
    --border2: #3a4a68;
    --text: #f0ede8;
    --text2: #9aabb8;
    --text3: #5a6e82;
    --danger: #d45a3a;
    --success: #4a9a6a;
    --info: #4a7ab5;
    --font: 'Nunito','Arial Rounded MT Bold',sans-serif;
    --mono: 'Source Code Pro','Courier New',monospace;
    --rw-bg: rgba(74,154,106,0.18); --rw-br: rgba(74,154,106,0.45); --rw-tx: #6dd49a;
    --rd-bg: rgba(74,122,181,0.18); --rd-br: rgba(74,122,181,0.45); --rd-tx: #7eb0e8;
    --rl-bg: rgba(212,90,58,0.18);  --rl-br: rgba(212,90,58,0.45);  --rl-tx: #e8826a;
  }
  body.light {
    --bg:#f5f3ef; --surface:#fff; --surface2:#f0ede8; --surface3:#e8e4dd;
    --border:#d8d2c8; --border2:#c0b8a8; --text:#1a1612; --text2:#5a5248; --text3:#9a9288;
    --rw-bg:rgba(40,120,70,.12); --rw-br:rgba(40,120,70,.35); --rw-tx:#287846;
    --rd-bg:rgba(27,60,111,.10); --rd-br:rgba(27,60,111,.35); --rd-tx:#1b3c6f;
    --rl-bg:rgba(180,60,30,.10); --rl-br:rgba(180,60,30,.35); --rl-tx:#b43c1e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;transition:background .2s,color .2s;}

  header{background:var(--navy);padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
  .hd-left{display:flex;align-items:center;gap:1rem;}
  .hd-icon{width:36px;height:36px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
  header h1{font-size:1.05rem;font-weight:800;color:var(--gold);line-height:1.2;}
  header .sub{font-size:.68rem;color:rgba(255,255,255,.45);font-weight:400;margin-top:2px;}
  .hd-right{display:flex;gap:.45rem;}
  .hbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);padding:.3rem .8rem;cursor:pointer;font-family:var(--font);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;transition:all .15s;}
  .hbtn:hover{background:rgba(255,255,255,.16);color:#fff;}

  .grade-tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 2rem;}
  .grade-tab{padding:.8rem 1.4rem;cursor:pointer;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;}
  .grade-tab:hover{color:var(--text2);}
  .grade-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  .grade-panel{display:none;padding:1.5rem 2rem;}
  .grade-panel.active{display:block;}

  .panel-tabs{display:flex;margin-bottom:1.5rem;border-bottom:1px solid var(--border);}
  .panel-tab{padding:.55rem 1.1rem;cursor:pointer;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
  .panel-tab:hover{color:var(--text2);}
  .panel-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  .sub-panel{display:none;}
  .sub-panel.active{display:block;}

  .stats-row{display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
  .stat-box{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);padding:.7rem 1.1rem;min-width:90px;border-radius:4px;}
  .stat-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:.25rem;}
  .stat-val{font-size:1.4rem;font-family:var(--mono);font-weight:600;color:var(--gold);}

  .reg-controls{display:flex;gap:.6rem;margin-bottom:1.1rem;align-items:center;flex-wrap:wrap;}
  .btn{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:.42rem 1rem;cursor:pointer;font-family:var(--font);font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:4px;transition:all .15s;}
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  .btn.primary{border-color:var(--gold);color:var(--gold);}
  .btn.primary:hover{background:var(--gold);color:var(--navy);}
  .btn.info{border-color:var(--info);color:var(--info);}
  .btn.info:hover{background:var(--info);color:#fff;}
  .btn.danger{border-color:var(--danger);color:var(--danger);}
  .btn.danger:hover{background:var(--danger);color:#fff;}
  .btn.success{border-color:var(--success);color:var(--success);}
  .btn.success:hover{background:var(--success);color:#fff;}
  .btn:disabled{opacity:.28;cursor:not-allowed;}
  .btn:disabled:hover{background:transparent;border-color:var(--border2);color:var(--text2);}
  .round-info{font-size:.7rem;color:var(--text3);margin-left:auto;}

  .reg-table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  thead th{text-align:left;padding:.45rem .75rem;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface2);}
  tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
  tbody tr:hover{background:var(--surface2);}
  tbody td{padding:.38rem .75rem;vertical-align:middle;}
  .seed-num{color:var(--text3);font-family:var(--mono);font-size:.7rem;width:36px;}

  input[type="text"],select{background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:.28rem .5rem;font-family:var(--font);font-size:.78rem;width:100%;border-radius:3px;transition:border-color .15s;}
  input[type="text"]:focus,select:focus{outline:none;border-color:var(--gold);}
  select option{background:var(--surface3);}

  .status-badge{display:inline-block;padding:.12rem .45rem;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;}
  .badge-active{background:rgba(74,154,106,.12);color:var(--success);border:1px solid rgba(74,154,106,.3);}
  .badge-wd{background:rgba(212,90,58,.12);color:var(--danger);border:1px solid rgba(212,90,58,.3);}

  .round-selector{display:flex;gap:.4rem;margin-bottom:1.3rem;flex-wrap:wrap;}
  .round-btn{padding:.3rem .85rem;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text3);font-family:var(--font);border-radius:4px;transition:all .15s;}
  .round-btn:hover{border-color:var(--gold);color:var(--gold);}
  .round-btn.active{border-color:var(--gold);color:var(--gold-dim);background:var(--gold-faint);}
  .round-btn.locked{border-color:var(--success);color:var(--success);background:rgba(74,154,106,.07);}

  .pairing-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:.5rem;display:grid;grid-template-columns:1.8rem 1fr 2.5rem 1fr 7.5rem;align-items:center;gap:.5rem;padding:.55rem .9rem;transition:border-color .15s;}
  .pairing-card:hover{border-color:var(--border2);}
  .pair-num{font-size:.62rem;color:var(--text3);font-family:var(--mono);text-align:center;}
  .pair-player{font-size:.82rem;font-weight:700;}
  .pair-player .pts{font-size:.62rem;color:var(--text3);font-weight:400;margin-top:2px;}
  .pair-vs{font-size:.62rem;color:var(--text3);text-align:center;font-weight:700;letter-spacing:.06em;}

  .rsel{background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:.28rem .4rem;font-size:.72rem;font-family:var(--font);font-weight:700;width:100%;cursor:pointer;border-radius:3px;transition:border-color .15s,background .15s,color .15s;}
  .rsel:focus{outline:none;border-color:var(--gold);}
  .rsel.rw{border-color:var(--rw-br);background:var(--rw-bg);color:var(--rw-tx);}
  .rsel.rd{border-color:var(--rd-br);background:var(--rd-bg);color:var(--rd-tx);}
  .rsel.rl{border-color:var(--rl-br);background:var(--rl-bg);color:var(--rl-tx);}

  .rpill{display:inline-block;padding:.22rem .6rem;font-size:.72rem;font-weight:700;font-family:var(--mono);border-radius:4px;text-align:center;width:100%;}
  .rpill.rw{background:var(--rw-bg);color:var(--rw-tx);border:1px solid var(--rw-br);}
  .rpill.rd{background:var(--rd-bg);color:var(--rd-tx);border:1px solid var(--rd-br);}
  .rpill.rl{background:var(--rl-bg);color:var(--rl-tx);border:1px solid var(--rl-br);}
  .rpill.rp{background:transparent;color:var(--text3);border:1px dashed var(--border2);}

  .bye-card{background:var(--surface);border:1px dashed var(--border2);border-radius:6px;margin-top:.85rem;margin-bottom:.5rem;padding:.5rem .9rem;display:flex;align-items:center;gap:1rem;font-size:.78rem;}
  .bye-lbl{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);background:var(--surface3);padding:.15rem .45rem;border-radius:3px;border:1px solid var(--border);flex-shrink:0;}

  .standings-table th{text-align:right;}
  .standings-table th:first-child,.standings-table th:nth-child(2),.standings-table th:nth-child(3){text-align:left;}
  .standings-table td{text-align:right;}
  .standings-table td:first-child{text-align:left;width:2.2rem;}
  .standings-table td:nth-child(2){text-align:left;}
  .standings-table td:nth-child(3){text-align:left;font-size:.7rem;color:var(--text3);}
  .rk1 td:nth-child(1),.rk1 td:nth-child(2){color:var(--gold);font-weight:800;}
  .rk2 td:nth-child(2){font-weight:700;}
  .pts-cell{font-family:var(--mono);font-weight:700;font-size:.88rem;}
  .buch-cell{font-family:var(--mono);font-size:.72rem;color:var(--text2);}

  .history-dots{display:flex;gap:3px;flex-wrap:wrap;}
  .dot{width:15px;height:15px;border-radius:3px;font-size:.58rem;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono);}
  .dw{background:var(--rw-bg);color:var(--rw-tx);border:1px solid var(--rw-br);}
  .dd{background:var(--rd-bg);color:var(--rd-tx);border:1px solid var(--rd-br);}
  .dl{background:var(--rl-bg);color:var(--rl-tx);border:1px solid var(--rl-br);}
  .db{background:var(--surface3);color:var(--text3);border:1px solid var(--border);}
  .dq{background:transparent;color:var(--text3);border:1px dashed var(--border);}

  .override-box{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.85rem 1rem;margin-bottom:1.2rem;}
  .override-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:.65rem;}
  .override-row{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;}
  .override-row select{max-width:75px;}

  .alert{padding:.65rem 1rem;border-left:3px solid;font-size:.76rem;margin-bottom:1rem;border-radius:0 4px 4px 0;}
  .alert-warn{border-color:var(--gold);background:var(--gold-faint);color:var(--text2);}
  .alert-locked{border-color:var(--success);background:rgba(74,154,106,.07);color:var(--success);display:flex;align-items:center;justify-content:space-between;gap:1rem;}

  .empty-state{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:.82rem;}

  .export-area{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1rem;font-family:var(--mono);font-size:.7rem;color:var(--text2);white-space:pre;overflow-x:auto;max-height:420px;overflow-y:auto;line-height:1.65;}

  .nm-cell{min-width:140px;}
  .sc-cell{min-width:120px;}

  @media(max-width:640px){
    .grade-tabs,.grade-panel{padding-left:1rem;padding-right:1rem;}
    header{padding:.8rem 1rem;}
    header h1{font-size:.9rem;}
    .pairing-card{grid-template-columns:1.5rem 1fr 1.8rem 1fr 5.5rem;}
  }
</style>
</head>
<body>

<header>
  <div class="hd-left">
    <div class="hd-icon">♟</div>
    <div>
      <h1>2º Torneio AEC Esposende</h1>
      <div class="sub" id="hdr-sub">Sistema de Gestão — Torneio Suíço</div>
    </div>
  </div>
  <div class="hd-right">
    <button class="hbtn" id="theme-btn" onclick="toggleTheme()">☀</button>
    <button class="hbtn" id="lang-btn" onclick="toggleLang()">EN</button>
  </div>
</header>

<div class="grade-tabs" id="grade-tabs"></div>
<div id="grade-panels"></div>

<script>
const T={
  pt:{
    grade:'Ano',players:'Jogadores',pairings:'Emparelhamentos',standings:'Classificação',export:'Exportar',
    addPlayer:'+ Adicionar Jogador',startTournament:'Iniciar Torneio',resetTournament:'Reiniciar',
    generatePairings:'Gerar Emparelhamentos',lockRound:'Bloquear Ronda',unlockRound:'Desbloquear Ronda',
    player:'Jogador',name:'Nome',school:'Escola',status:'Estado',active:'Activo',withdrawn:'Retirado',
    round:'Ronda',board:'Tab.',white:'Brancas',black:'Pretas',result:'Resultado',
    points:'Pts',buchholz:'Buchholz',buchholzCut:'B-Cut1',wins:'V',history:'Hist.',rank:'#',bye:'BYE',
    totalPlayers:'Jogadores',totalRounds:'Rondas',currentRound:'Ronda Actual',completed:'Completas',
    noPairings:'Sem emparelhamentos para esta ronda.',roundLocked:'Ronda bloqueada.',
    tournamentNotStarted:'Torneio não iniciado. Regista os jogadores primeiro.',
    overrideTitle:'Substituição Manual',overrideSwap:'Trocar',exportCopy:'Copiar',deletePlayer:'Rem.',
    confirmReset:'Reiniciar o torneio deste ano? Todos os dados serão perdidos.',
    roundOptimal:'Rondas óptimas para',players2:'jogadores',
    byePoints:'(+1 ponto automático)',withdraw:'Retirar',reactivate:'Reactivar',
    sub:'Sistema de Gestão — Torneio Suíço',
  },
  en:{
    grade:'Grade',players:'Players',pairings:'Pairings',standings:'Standings',export:'Export',
    addPlayer:'+ Add Player',startTournament:'Start Tournament',resetTournament:'Reset',
    generatePairings:'Generate Pairings',lockRound:'Lock Round',unlockRound:'Unlock Round',
    player:'Player',name:'Name',school:'School',status:'Status',active:'Active',withdrawn:'Withdrawn',
    round:'Round',board:'Bd.',white:'White',black:'Black',result:'Result',
    points:'Pts',buchholz:'Buchholz',buchholzCut:'B-Cut1',wins:'W',history:'Hist.',rank:'#',bye:'BYE',
    totalPlayers:'Players',totalRounds:'Rounds',currentRound:'Current Round',completed:'Completed',
    noPairings:'No pairings for this round.',roundLocked:'Round is locked.',
    tournamentNotStarted:'Tournament not started. Register players first.',
    overrideTitle:'Manual Override',overrideSwap:'Swap',exportCopy:'Copy',deletePlayer:'Del.',
    confirmReset:'Reset this grade? All data will be lost.',
    roundOptimal:'Optimal rounds for',players2:'players',
    byePoints:'(+1 point automatic)',withdraw:'Withdraw',reactivate:'Reactivate',
    sub:'Management System — Swiss Tournament',
  }
};

let lang='pt', theme='dark';
const GRADES=[1,2,3,4];
const DEFAULT_N=23;
function t(k){return T[lang][k]||k;}

const state={};
GRADES.forEach(g=>{
  state[g]=loadState(g)||{
    players:Array.from({length:DEFAULT_N},(_,i)=>({id:i+1,name:'',school:'',active:true})),
    rounds:[],started:false,currentRound:0,nextId:DEFAULT_N+1,
  };
});

function saveState(g){try{localStorage.setItem('aec_swiss_'+g,JSON.stringify(state[g]));}catch(e){}}
function loadState(g){try{const s=localStorage.getItem('aec_swiss_'+g);return s?JSON.parse(s):null;}catch(e){return null;}}

// ── SWISS ENGINE ──────────────────────────────────────────────────────────────
function optR(n){return Math.max(5,Math.ceil(Math.log2(Math.max(n,2)))+1);}
function activePl(g){return state[g].players.filter(p=>p.active);}

function pts(g,pid,upTo){
  let p=0;
  state[g].rounds.slice(0,upTo).forEach(r=>r.pairings.forEach(pr=>{
    if(pr.bye&&pr.whiteId===pid){p+=1;return;}
    if(pr.result==null)return;
    if(pr.whiteId===pid){if(pr.result===1)p+=1;else if(pr.result===.5)p+=.5;}
    else if(pr.blackId===pid){if(pr.result===0)p+=1;else if(pr.result===.5)p+=.5;}
  }));
  return p;
}

function wins(g,pid){
  let w=0;
  state[g].rounds.forEach(r=>r.pairings.forEach(p=>{
    if(!p.bye&&p.result!=null){
      if(p.whiteId===pid&&p.result===1)w++;
      if(p.blackId===pid&&p.result===0)w++;
    }
  }));
  return w;
}

function buch(g,pid,cut1){
  const ops=[];
  state[g].rounds.forEach(r=>r.pairings.forEach(p=>{
    if(p.bye)return;
    let o=null;
    if(p.whiteId===pid)o=p.blackId;
    else if(p.blackId===pid)o=p.whiteId;
    if(o!=null)ops.push(pts(g,o,state[g].rounds.length));
  }));
  if(!ops.length)return 0;
  if(cut1){ops.sort((a,b)=>a-b);ops.shift();}
  return ops.reduce((a,b)=>a+b,0);
}

function opps(g,pid){
  const s=new Set();
  state[g].rounds.forEach(r=>r.pairings.forEach(p=>{
    if(p.bye)return;
    if(p.whiteId===pid)s.add(p.blackId);
    if(p.blackId===pid)s.add(p.whiteId);
  }));
  return s;
}

function colorHist(g,pid){
  return state[g].rounds.map(r=>{
    for(const p of r.pairings){
      if(p.bye&&p.whiteId===pid)return 'bye';
      if(p.whiteId===pid)return 'w';
      if(p.blackId===pid)return 'b';
    }
    return null;
  }).filter(x=>x!==null);
}

function hadBye(g,pid){return state[g].rounds.some(r=>r.pairings.some(p=>p.bye&&p.whiteId===pid));}

function genPairings(g){
  const active=activePl(g);
  const ri=state[g].rounds.length;
  const score={};
  active.forEach(p=>{score[p.id]=pts(g,p.id,ri);});
  const sorted=[...active].sort((a,b)=>score[b.id]-score[a.id]);

  let byeP=null;
  let pool=[...sorted];

  // Bye to LAST-ranked player without a bye (bottom of standings)
  if(pool.length%2!==0){
    for(let i=pool.length-1;i>=0;i--){
      if(!hadBye(g,pool[i].id)){byeP=pool.splice(i,1)[0];break;}
    }
    if(!byeP)byeP=pool.pop();
  }

  const pairings=[];
  const paired=new Set();
  const oMap={};
  pool.forEach(p=>{oMap[p.id]=opps(g,p.id);});

  const groups={};
  pool.forEach(p=>{const v=score[p.id];if(!groups[v])groups[v]=[];groups[v].push(p);});
  const keys=Object.keys(groups).map(Number).sort((a,b)=>b-a);
  let rem=[];

  keys.forEach(sc=>{
    const grp=[...rem,...groups[sc]];rem=[];
    let i=0;
    while(i<grp.length){
      if(paired.has(grp[i].id)){i++;continue;}
      let found=false;
      for(let j=i+1;j<grp.length;j++){
        if(paired.has(grp[j].id))continue;
        if(!oMap[grp[i].id].has(grp[j].id)){
          const h1=colorHist(g,grp[i].id),h2=colorHist(g,grp[j].id);
          const l1=h1[h1.length-1],l2=h2[h2.length-1];
          let w,b;
          if(l1==='w'&&l2!=='w'){w=grp[j];b=grp[i];}
          else if(l1==='b'&&l2!=='b'){w=grp[i];b=grp[j];}
          else if(l2==='w'){w=grp[i];b=grp[j];}
          else{w=grp[i];b=grp[j];}
          pairings.push({whiteId:w.id,blackId:b.id,result:null,bye:false});
          paired.add(grp[i].id);paired.add(grp[j].id);
          found=true;i++;break;
        }
      }
      if(!found){rem.push(grp[i]);i++;}
    }
  });

  const unp=pool.filter(p=>!paired.has(p.id)&&!rem.includes(p));
  const allRem=[...rem,...unp];
  for(let i=0;i<allRem.length-1;i+=2){
    const h=colorHist(g,allRem[i].id);
    const lc=h[h.length-1];
    const w=lc==='w'?allRem[i+1]:allRem[i];
    const b=lc==='w'?allRem[i]:allRem[i+1];
    pairings.push({whiteId:w.id,blackId:b.id,result:null,bye:false});
  }

  // BYE always last
  if(byeP)pairings.push({whiteId:byeP.id,blackId:null,result:null,bye:true});
  return pairings;
}

function standings(g){
  return state[g].players.map(p=>({
    ...p,points:pts(g,p.id,state[g].rounds.length),wins:wins(g,p.id),
    bh:buch(g,p.id,false),bh1:buch(g,p.id,true),hist:resultHist(g,p.id),
  })).sort((a,b)=>{
    if(b.points!==a.points)return b.points-a.points;
    if(b.bh!==a.bh)return b.bh-a.bh;
    if(b.bh1!==a.bh1)return b.bh1-a.bh1;
    return b.wins-a.wins;
  });
}

function resultHist(g,pid){
  return state[g].rounds.map(r=>{
    for(const p of r.pairings){
      if(p.bye&&p.whiteId===pid)return 'b';
      if(p.result==null)return '?';
      if(p.whiteId===pid){return p.result===1?'w':p.result===.5?'d':'l';}
      if(p.blackId===pid){return p.result===0?'w':p.result===.5?'d':'l';}
    }
    return null;
  }).filter(x=>x!==null);
}

function plById(g,id){return state[g].players.find(p=>p.id===id);}
function fp(n){return n===Math.floor(n)?n.toString():n.toFixed(1);}

// ── RENDER ────────────────────────────────────────────────────────────────────
let activeGrade=1;
const activeSub={};
GRADES.forEach(g=>{activeSub[g]='players';});

function renderAll(){renderTabs();renderPanels();}
function renderTabs(){
  document.getElementById('grade-tabs').innerHTML=GRADES.map(g=>
    `<div class="grade-tab ${g===activeGrade?'active':''}" onclick="switchGrade(${g})">${t('grade')} ${g}</div>`
  ).join('');
}
function renderPanels(){
  document.getElementById('grade-panels').innerHTML=GRADES.map(g=>
    `<div class="grade-panel ${g===activeGrade?'active':''}" id="pg-${g}">${rGradePanel(g)}</div>`
  ).join('');
}
function rGradePanel(g){
  const s=state[g];
  const ap=activePl(g);
  const nr=optR(ap.length);
  return `
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">${t('totalPlayers')}</div><div class="stat-val">${ap.length}</div></div>
      <div class="stat-box"><div class="stat-label">${t('totalRounds')}</div><div class="stat-val">${nr}</div></div>
      <div class="stat-box"><div class="stat-label">${t('currentRound')}</div><div class="stat-val">${s.started?s.currentRound:'—'}</div></div>
      <div class="stat-box"><div class="stat-label">${t('completed')}</div><div class="stat-val">${s.rounds.filter(r=>r.locked).length}</div></div>
    </div>
    <div class="panel-tabs">
      ${['players','pairings','standings','export'].map(p=>
        `<div class="panel-tab ${activeSub[g]===p?'active':''}" onclick="switchSub(${g},'${p}')">${t(p)}</div>`
      ).join('')}
    </div>
    <div class="sub-panel ${activeSub[g]==='players'?'active':''}">${rPlayers(g)}</div>
    <div class="sub-panel ${activeSub[g]==='pairings'?'active':''}">${rPairings(g)}</div>
    <div class="sub-panel ${activeSub[g]==='standings'?'active':''}">${rStandings(g)}</div>
    <div class="sub-panel ${activeSub[g]==='export'?'active':''}">${rExport(g)}</div>`;
}

function rPlayers(g){
  const s=state[g];
  const ap=s.players.filter(p=>p.active).length;
  const nr=optR(ap);
  const un=s.players.filter(p=>p.active&&!p.name.trim()).length;
  return `
    <div class="reg-controls">
      <button class="btn primary" onclick="addPlayer(${g})">${t('addPlayer')}</button>
      ${!s.started?`<button class="btn primary" onclick="startTournament(${g})" ${ap<2?'disabled':''}>${t('startTournament')}</button>`:''}
      <button class="btn danger" onclick="resetTournament(${g})">${t('resetTournament')}</button>
      <span class="round-info">${t('roundOptimal')} ${ap} ${t('players2')}: <strong style="color:var(--gold)">${nr}</strong></span>
    </div>
    ${un>0&&s.started?`<div class="alert alert-warn">${un} ${lang==='pt'?'jogadores sem nome.':'players without names.'}</div>`:''}
    <div class="reg-table-wrap">
      <table>
        <thead><tr><th>${t('rank')}</th><th class="nm-cell">${t('name')}</th><th class="sc-cell">${t('school')}</th><th>${t('status')}</th><th></th></tr></thead>
        <tbody>${s.players.map((p,i)=>`
          <tr>
            <td class="seed-num">${i+1}</td>
            <td class="nm-cell"><input type="text" value="${esc(p.name)}" placeholder="${t('name')} ${i+1}" oninput="upd(${g},${p.id},'name',this.value)"></td>
            <td class="sc-cell"><input type="text" value="${esc(p.school)}" placeholder="${t('school')}" oninput="upd(${g},${p.id},'school',this.value)"></td>
            <td>${p.active?`<span class="status-badge badge-active">${t('active')}</span>`:`<span class="status-badge badge-wd">${t('withdrawn')}</span>`}</td>
            <td style="display:flex;gap:4px;flex-wrap:wrap">
              <button class="btn info" onclick="toggleWd(${g},${p.id})" style="font-size:.62rem;padding:.2rem .5rem">${p.active?t('withdraw'):t('reactivate')}</button>
              ${!s.started?`<button class="btn danger" onclick="delPlayer(${g},${p.id})" style="font-size:.62rem;padding:.2rem .5rem">${t('deletePlayer')}</button>`:''}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function rPairings(g){
  const s=state[g];
  if(!s.started)return`<div class="empty-state">${t('tournamentNotStarted')}</div>`;
  const totalR=optR(activePl(g).length);
  const vr=s.viewRound||s.currentRound;
  const rd=s.rounds[vr-1];
  return `
    <div class="reg-controls">
      ${s.currentRound<=totalR&&!s.rounds[s.currentRound-1]
        ?`<button class="btn primary" onclick="doGenPairings(${g})">${t('generatePairings')}</button>`:''}
      ${rd&&!rd.locked&&vr===s.currentRound
        ?`<button class="btn primary" onclick="lockRound(${g})">${t('lockRound')}</button>`:''}
    </div>
    <div class="round-selector">
      ${Array.from({length:totalR},(_,i)=>i+1).map(r=>{
        const rrd=s.rounds[r-1];
        const cls=r===vr?'active':(rrd&&rrd.locked?'locked':'');
        return`<button class="round-btn ${cls}" onclick="setVR(${g},${r})">${t('round')} ${r}</button>`;
      }).join('')}
    </div>
    ${rRoundPairings(g,vr)}`;
}

function rRoundPairings(g,rn){
  const s=state[g];
  const rd=s.rounds[rn-1];
  if(!rd){
    if(rn===s.currentRound)return`<div class="empty-state">${lang==='pt'?'Clica em "Gerar Emparelhamentos" para criar os pares desta ronda.':'Click "Generate Pairings" to create pairings for this round.'}</div>`;
    return`<div class="empty-state">${t('noPairings')}</div>`;
  }
  const locked=rd.locked;
  const boards=rd.pairings.filter(p=>!p.bye);
  const byes=rd.pairings.filter(p=>p.bye);
  let html='';

  if(!locked&&rn===s.currentRound)html+=rOverride(g,rn);

  // ── UNLOCK BUTTON lives here inside the locked alert ──
  if(locked){
    html+=`<div class="alert alert-locked">
      <span>&#128274; ${t('roundLocked')}</span>
      <button class="btn success" onclick="unlockRound(${g})" style="font-size:.68rem;padding:.28rem .75rem">${t('unlockRound')}</button>
    </div>`;
  }

  boards.forEach((pair,i)=>{
    const wp=plById(g,pair.whiteId);
    const bp=plById(g,pair.blackId);
    const wpPts=fp(pts(g,pair.whiteId,rn-1));
    const bpPts=fp(pts(g,pair.blackId,rn-1));
    const widget=locked?rPill(pair.result):rSel(g,rn-1,i,pair.result);
    html+=`<div class="pairing-card">
      <div class="pair-num">${i+1}</div>
      <div class="pair-player"><div>${wp?(wp.name||`${t('player')} ${wp.id}`):'?'}</div><div class="pts">${wpPts} ${t('points')} · ${t('white')}</div></div>
      <div class="pair-vs">vs</div>
      <div class="pair-player" style="text-align:right"><div>${bp?(bp.name||`${t('player')} ${bp.id}`):'?'}</div><div class="pts">${bpPts} ${t('points')} · ${t('black')}</div></div>
      <div>${widget}</div>
    </div>`;
  });

  // BYE always appended at the very bottom
  byes.forEach(pair=>{
    const wp=plById(g,pair.whiteId);
    html+=`<div class="bye-card">
      <span class="bye-lbl">${t('bye')}</span>
      <span style="font-weight:700">${wp?(wp.name||`${t('player')} ${wp.id}`):'?'}</span>
      <span style="font-size:.68rem;color:var(--text3)">${t('byePoints')}</span>
    </div>`;
  });
  return html;
}

function rSel(g,ri,bi,cur){
  let cls='',val='';
  if(cur===1){cls='rw';val='1';}else if(cur===.5){cls='rd';val='0.5';}else if(cur===0){cls='rl';val='0';}
  return`<select class="rsel ${cls}" onchange="setResult(${g},${ri},${bi},this.value);clrSel(this)">
    <option value="" ${val===''?'selected':''}>—</option>
    <option value="1" ${val==='1'?'selected':''}>1 — 0</option>
    <option value="0.5" ${val==='0.5'?'selected':''}>½ — ½</option>
    <option value="0" ${val==='0'?'selected':''}>0 — 1</option>
  </select>`;
}

function rPill(r){
  if(r===1)return`<div class="rpill rw">1 — 0</div>`;
  if(r===.5)return`<div class="rpill rd">½ — ½</div>`;
  if(r===0)return`<div class="rpill rl">0 — 1</div>`;
  return`<div class="rpill rp">—</div>`;
}

function rOverride(g,rn){
  const rd=state[g].rounds[rn-1];
  if(!rd)return'';
  const boards=rd.pairings.filter(p=>!p.bye);
  const opts=boards.map((_,i)=>`<option value="${i}">${t('board')} ${i+1}</option>`).join('');
  return`<div class="override-box">
    <div class="override-title">${t('overrideTitle')}</div>
    <div class="override-row">
      <select id="ob1-${g}">${opts}</select>
      <span style="font-size:.7rem;color:var(--text3)">${lang==='pt'?'com':'with'}</span>
      <select id="ob2-${g}">${opts}</select>
      <button class="btn" onclick="doOverride(${g},${rn})">${t('overrideSwap')}</button>
    </div>
  </div>`;
}

function rStandings(g){
  const s=state[g];
  if(!s.started&&!s.rounds.length)return`<div class="empty-state">${t('tournamentNotStarted')}</div>`;
  const st=standings(g);
  return`<div class="reg-table-wrap"><table class="standings-table">
    <thead><tr>
      <th>${t('rank')}</th><th>${t('name')}</th><th>${t('school')}</th>
      <th>${t('points')}</th><th>${t('wins')}</th><th>${t('buchholz')}</th><th>${t('buchholzCut')}</th><th>${t('history')}</th>
    </tr></thead>
    <tbody>${st.map((p,i)=>{
      const rc=i===0?'rk1':i===1?'rk2':i===2?'rk3':'';
      return`<tr class="${rc}">
        <td style="font-family:var(--mono);font-size:.75rem">${i+1}</td>
        <td style="font-size:.82rem">${p.name||`${t('player')} ${p.id}`}${!p.active?` <span class="status-badge badge-wd" style="font-size:.58rem">W</span>`:''}</td>
        <td>${p.school||'—'}</td>
        <td class="pts-cell">${fp(p.points)}</td>
        <td class="buch-cell">${p.wins}</td>
        <td class="buch-cell">${fp(p.bh)}</td>
        <td class="buch-cell">${fp(p.bh1)}</td>
        <td><div class="history-dots">${p.hist.map(h=>{
          if(h==='w')return`<div class="dot dw">W</div>`;
          if(h==='d')return`<div class="dot dd">D</div>`;
          if(h==='l')return`<div class="dot dl">L</div>`;
          if(h==='b')return`<div class="dot db">B</div>`;
          return`<div class="dot dq">?</div>`;
        }).join('')}</div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function rExport(g){
  const s=state[g];
  const st=standings(g);
  const ap=activePl(g);
  const nr=optR(ap.length);
  const lpt=lang==='pt';
  let txt=`2º TORNEIO AEC ESPOSENDE — ${lpt?'ANO':'GRADE'} ${g}\n${'─'.repeat(56)}\n`;
  txt+=`${lpt?'Jogadores':'Players'}: ${ap.length}  |  ${lpt?'Rondas':'Rounds'}: ${nr}  |  ${lpt?'Ronda actual':'Current round'}: ${s.currentRound}\n\n`;
  txt+=`${lpt?'CLASSIFICAÇÃO':'STANDINGS'}\n${'─'.repeat(56)}\n`;
  txt+=`#   ${lpt?'Nome':'Name'}                  ${lpt?'Escola':'School'}              Pts   BH    BH-1  ${lpt?'V':'W'}\n${'─'.repeat(72)}\n`;
  st.forEach((p,i)=>{
    const nm=(p.name||`Player ${p.id}`).padEnd(21).substring(0,21);
    const sc=(p.school||'—').padEnd(19).substring(0,19);
    txt+=`${String(i+1).padEnd(4)}${nm} ${sc} ${fp(p.points).padEnd(5)} ${fp(p.bh).padEnd(5)} ${fp(p.bh1).padEnd(5)} ${p.wins}\n`;
  });
  s.rounds.forEach((r,ri)=>{
    txt+=`\n${lpt?'RONDA':'ROUND'} ${ri+1}${r.locked?(lpt?' [BLOQUEADA]':' [LOCKED]'):''}\n${'─'.repeat(42)}\n`;
    r.pairings.forEach((p,bi)=>{
      if(p.bye){const bp=plById(g,p.whiteId);txt+=`  BYE: ${bp?(bp.name||`P${bp.id}`):'?'}\n`;}
      else{
        const wp=plById(g,p.whiteId),bp=plById(g,p.blackId);
        txt+=`  ${String(bi+1).padEnd(3)} ${(wp?(wp.name||`P${wp.id}`):'?').padEnd(20)} vs ${(bp?(bp.name||`P${bp.id}`):'?').padEnd(20)} ${fmtR(p.result)}\n`;
      }
    });
  });
  return`<div class="reg-controls"><button class="btn primary" onclick="copyExport(${g})">${t('exportCopy')}</button></div>
    <div class="export-area" id="ea-${g}">${esc(txt)}</div>`;
}

function fmtR(r){if(r===1)return'1 — 0';if(r===.5)return'½ — ½';if(r===0)return'0 — 1';return'—';}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function switchGrade(g){activeGrade=g;renderAll();}
function switchSub(g,p){activeSub[g]=p;refresh(g);}
function refresh(g){const el=document.getElementById(`pg-${g}`);if(el)el.innerHTML=rGradePanel(g);}

function toggleLang(){
  lang=lang==='pt'?'en':'pt';
  document.getElementById('lang-btn').textContent=lang==='pt'?'EN':'PT';
  document.getElementById('hdr-sub').textContent=t('sub');
  renderAll();
}

function toggleTheme(){
  theme=theme==='dark'?'light':'dark';
  document.body.classList.toggle('light',theme==='light');
  document.getElementById('theme-btn').textContent=theme==='dark'?'☀':'☾';
}

function addPlayer(g){
  const s=state[g];
  s.players.push({id:s.nextId,name:'',school:'',active:true});
  s.nextId++;saveState(g);refresh(g);
}

function upd(g,id,f,v){
  const p=state[g].players.find(p=>p.id===id);
  if(p){p[f]=v;saveState(g);}
}

function toggleWd(g,id){
  const p=state[g].players.find(p=>p.id===id);
  if(p){p.active=!p.active;saveState(g);refresh(g);}
}

function delPlayer(g,id){
  if(state[g].started)return;
  state[g].players=state[g].players.filter(p=>p.id!==id);
  saveState(g);refresh(g);
}

function startTournament(g){
  const s=state[g];
  if(activePl(g).length<2)return;
  s.started=true;s.currentRound=1;s.rounds=[];s.viewRound=1;
  activeSub[g]='pairings';saveState(g);refresh(g);
}

function resetTournament(g){
  if(!confirm(t('confirmReset')))return;
  state[g].started=false;state[g].currentRound=0;state[g].rounds=[];state[g].viewRound=1;
  activeSub[g]='players';saveState(g);refresh(g);
}

function doGenPairings(g){
  const s=state[g];
  if(s.rounds[s.currentRound-1])return;
  s.rounds[s.currentRound-1]={pairings:genPairings(g),locked:false};
  s.viewRound=s.currentRound;saveState(g);refresh(g);
}

function setVR(g,r){state[g].viewRound=r;saveState(g);refresh(g);}

function setResult(g,ri,bi,v){
  const pair=state[g].rounds[ri].pairings[bi];
  pair.result=v===''?null:parseFloat(v);
  saveState(g);
}

function clrSel(el){
  el.className='rsel';
  if(el.value==='1')el.classList.add('rw');
  else if(el.value==='0.5')el.classList.add('rd');
  else if(el.value==='0')el.classList.add('rl');
}

function lockRound(g){
  const s=state[g];
  const rd=s.rounds[s.currentRound-1];
  if(!rd)return;
  rd.pairings.forEach(p=>{if(p.bye)p.result=1;});
  rd.locked=true;
  const tr=optR(activePl(g).length);
  if(s.currentRound<tr){s.currentRound++;s.viewRound=s.currentRound;}
  saveState(g);refresh(g);
}

function unlockRound(g){
  const s=state[g];
  const rd=s.rounds[s.viewRound-1];
  if(!rd)return;
  rd.locked=false;
  if(s.currentRound>s.viewRound)s.currentRound=s.viewRound;
  saveState(g);refresh(g);
}

function doOverride(g,rn){
  const s=state[g];
  const b1=parseInt(document.getElementById(`ob1-${g}`).value);
  const b2=parseInt(document.getElementById(`ob2-${g}`).value);
  if(b1===b2)return;
  const rd=s.rounds[rn-1];
  const boards=rd.pairings.filter(p=>!p.bye);
  const byes=rd.pairings.filter(p=>p.bye);
  const tmp=boards[b1].whiteId;
  boards[b1].whiteId=boards[b2].whiteId;
  boards[b2].whiteId=tmp;
  rd.pairings=[...boards,...byes];
  saveState(g);refresh(g);
}

function copyExport(g){
  const el=document.getElementById(`ea-${g}`);
  if(!el)return;
  navigator.clipboard.writeText(el.textContent).then(()=>{
    const btn=el.previousElementSibling.querySelector('button');
    if(btn){const o=btn.textContent;btn.textContent=lang==='pt'?'Copiado!':'Copied!';setTimeout(()=>btn.textContent=o,1500);}
  }).catch(()=>{});
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

renderAll();
</script>
</body>
</html>
